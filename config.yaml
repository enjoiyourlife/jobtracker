# 17 companies from companies.txt didn't resolve on Greenhouse, Lever,
# or Ashby and need manual lookup (Workday, custom career sites, etc.):
# Anduril, Box, Dbt Labs, DigitalOcean, Grammarly, HashiCorp,
# Hugging Face, Optimizely, Rippling, ServiceTitan, Snyk, Tile, Tubi,
# Unity, Vimeo, Whatnot, Wiz.

role:
  # A title matching any of these is a candidate coding role.
  include:
    - software engineer
    - software developer
    - software dev
    - swe
    - backend engineer
    - back end engineer
    - backend developer
    - frontend engineer
    - front end engineer
    - frontend developer
    - full stack
    - fullstack
    - application developer
    - applications engineer
    - platform engineer
    - systems engineer
    - sdet
    - test engineer
    - automation engineer
    - qa engineer
    - quality engineer
    - member of technical staff

  # Evaluated first. These contain include-list words but are not
  # coding roles, or are too senior — the reason a naive include-only
  # filter returns junk. Multi-word senior titles need their own
  # entries: "staff engineer" does not match "Staff Software Engineer".
  exclude:
    - sales engineer
    - solutions engineer
    - solution engineer
    - customer engineer
    - support engineer
    - field engineer
    - engineering manager
    - manager, engineering
    - manager, software
    - head of
    - vp
    - director
    - recruiter
    - technical recruiter
    - program manager
    - product manager
    - technical program manager
    - engineering intern      # remove this line if internships are wanted
    - internship              # catches "Software Engineer Internship, ..." too
    - principal
    - staff engineer
    - staff software
    - distinguished
    - phd
    - founding

# Seniority scoring. Applied to the title.
seniority:
  preferred:                  # +30
    - junior
    - associate
    - new grad
    - new graduate
    - university grad
    - entry level
    - "i"
    - "1"
  neutral: 0                  # no seniority marker at all
  penalized:                  # -40
    - senior
    - sr.
    - lead
    - staff
    - "iii"
    - "iv"

# Location scoring, matched against the posting's location string.
# Countries other than the US a posting's location might name. Shared
# by two different rules below via the YAML anchor, so adding a country
# here fixes both at once instead of the two lists silently drifting
# apart. Not a real config section — Criteria.load() only reads the
# top-level keys it knows about, so this is ignored as data.
_non_us_countries: &non_us_countries
  - argentina
  - brazil
  - canada
  - mexico
  - colombia
  - chile
  - peru
  - uk
  - united kingdom
  - ireland
  - portugal
  - spain
  - france
  - germany
  - netherlands
  - poland
  - romania
  - bulgaria
  - ukraine
  - india
  - pakistan
  - philippines
  - singapore
  - australia
  - new zealand
  - japan
  - china
  - south korea
  - sweden
  - vietnam
  - indonesia
  - nigeria
  - kenya
  - south africa
  - egypt
  - uae
  - israel
  - turkey

location:
  tiers:
    - score: 40
      match: [seattle, bellevue, redmond, kirkland]
    - score: 40
      match: [portland, beaverton, hillsboro]
    - score: 35
      match: [orlando, tampa]
    - score: 30
      match: [los angeles, san diego, irvine, pasadena, santa monica, burbank, el segundo]
    - score: 25
      match: [remote, remote - us, united states]
      # "remote" alone is too loose — it also matches "Remote (Bulgaria)".
      # No exclude needed here: location.disallow below already catches
      # any non-US-country location before tiers are even considered.
  # Anything not matching a tier scores 0 rather than being dropped —
  # a strong role in an unlisted city still surfaces, just lower. That
  # principle stops at work authorization, though: a posting whose
  # location names a non-US country isn't "lower priority," it's not
  # actually available, so it's penalized hard enough here to drop
  # below min_score regardless of how well the title scores elsewhere.
  disallow: *non_us_countries

# Years-of-experience parsed from the description.
experience:
  max_years: 2                # above this, penalize
  penalty_per_year: 15

# Minimum total score to appear in the ranked output.
min_score: 20