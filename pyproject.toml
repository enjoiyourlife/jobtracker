[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobtracker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jobtracker.db" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]