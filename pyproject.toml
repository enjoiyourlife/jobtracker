[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobtracker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx", "pyyaml", "anthropic", "python-dotenv", "flask", "ruamel.yaml", "pywebview"]

# Installs a `jobtracker` command on PATH that calls cli.main().
[project.scripts]
jobtracker = "jobtracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jobtracker.db" = ["*.sql"]
"jobtracker" = ["templates/*.html", "config.default.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]