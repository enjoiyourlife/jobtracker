[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobtracker"
version = "0.1.2"
requires-python = ">=3.11"
dependencies = ["httpx", "pyyaml", "anthropic", "python-dotenv", "flask", "ruamel.yaml", "pywebview"]

# jobtracker: the full CLI. jobtracker-app: GUI-only, no arguments —
# what a double-clicked packaged app actually runs (see app_main.py).
[project.scripts]
jobtracker = "jobtracker.cli:main"
jobtracker-app = "jobtracker.app_main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jobtracker.db" = ["*.sql"]
"jobtracker" = ["templates/*.html", "config.default.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]