<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}jobtracker{% endblock %}</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         max-width: 900px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  nav { display: flex; gap: 1.25rem; margin-bottom: 1.5rem; padding-bottom: 1rem;
        border-bottom: 1px solid #88888833; }
  nav a { text-decoration: none; font-weight: 600; color: inherit; opacity: 0.55; }
  nav a.active { opacity: 1; border-bottom: 2px solid currentColor; padding-bottom: 0.9rem; margin-bottom: -1rem; }
  h2 { margin-top: 2rem; }
  .posting { border: 1px solid #88888833; border-radius: 8px; padding: 1rem; margin-bottom: 0.75rem; }
  .posting h3 { margin: 0 0 0.25rem; }
  .meta { opacity: 0.65; font-size: 0.9rem; margin-bottom: 0.6rem; }
  .score { font-variant-numeric: tabular-nums; font-weight: 700; opacity: 0.8; }
  .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .actions a, .actions button { padding: 0.4rem 0.9rem; border-radius: 6px; border: 1px solid #88888855;
        cursor: pointer; text-decoration: none; color: inherit; font: inherit; background: none; }
  .apply { background: #2563eb; color: white; border-color: #2563eb; }
  .flash { background: #22c55e2a; border: 1px solid #22c55e88; padding: 0.6rem 1rem;
           border-radius: 6px; margin-bottom: 1rem; }
  fieldset { border: 1px solid #88888833; border-radius: 8px; margin-bottom: 1.25rem; padding: 0 1rem 1rem; }
  legend { font-weight: 700; padding: 0 0.4rem; }
  label { display: block; font-weight: 600; margin: 1rem 0 0.3rem; }
  textarea, input[type=text], input[type=number], select {
    width: 100%; box-sizing: border-box; padding: 0.45rem 0.6rem; font: inherit;
    border-radius: 5px; border: 1px solid #88888866; background: transparent; color: inherit; }
  .tier-row { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; align-items: center; }
  .tier-row select { width: 11rem; flex: none; }
  small { opacity: 0.6; display: block; margin-bottom: 0.5rem; }
  .checkbox-row { display: flex; align-items: center; gap: 0.5rem; font-weight: normal;
                  margin: 0.5rem 0; }
  .checkbox-row input { width: auto; }
  details { margin-top: 1.25rem; padding-top: 0.9rem; border-top: 1px solid #88888833; }
  summary { cursor: pointer; font-weight: 600; opacity: 0.75; }
  summary:hover { opacity: 1; }
</style>
</head>
<body>
<nav>
  <a href="/" class="{{ 'active' if active == 'queue' else '' }}">Queue</a>
  <a href="/status" class="{{ 'active' if active == 'status' else '' }}">Status</a>
  <a href="/settings" class="{{ 'active' if active == 'settings' else '' }}">Settings</a>
</nav>
{% with messages = get_flashed_messages() %}
  {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</body>
</html>
