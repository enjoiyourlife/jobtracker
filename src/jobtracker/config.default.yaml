# No cities configured yet — add them from Settings ("Where do you
# want to work?"). A posting in an unlisted city still shows up, just
# without a location bonus. That principle stops at work authorization,
# though: a posting naming a non-US country isn't "lower priority,"
# it's not actually available, so disallow vetoes it outright.
location:
  tiers: []
  disallow: *non_us_countries

experience:
  max_years: 2
  penalty_per_year: 15

min_score: 0

browser: system
